*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif;padding-bottom:72px}

main{padding:0 14px 20px;max-width:640px;margin:0 auto}

.chip.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.chip small{display:block;opacity:.8;font-size:11px}

.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:3px solid var(--soft)}
.tl li{position:relative;padding:0 0 14px 14px}
.tl li::before{content:"";position:absolute;left:-23px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--ac);border:2px solid var(--bg)}

.tl .t{font-weight:500}
.tl small{display:block;color:var(--mut);font-size:13px}
.tl li.pb::before{background:var(--hi)}
.tag{display:inline-block;background:var(--hi);color:#2a2000;border-radius:6px;font-size:11px;padding:0 6px;margin-right:4px;font-weight:700}
h2{font-size:16px;margin:4px 0 8px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mh b{font-size:15px}
.pk{margin:6px 0 0;padding-left:0;list-style:none;color:var(--mut);font-size:14px}
.pk li{padding:2px 0}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}

input.n{width:110px;text-align:right}
label.ck{display:flex;gap:6px;align-items:center;font-size:14px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
td:first-child,th:first-child{text-align:left}
th{font-weight:500;color:var(--mut)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:24px;font-weight:700;letter-spacing:-.02em}
.mut{color:var(--mut);font-size:13px}
.jp{font-size:19px;font-weight:700;line-height:1.35;margin:4px 0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.done{opacity:.55;text-decoration:line-through}
.empty{color:var(--mut);padding:14px 0;text-align:center}
.rt{display:inline-block;margin-top:4px;font-size:13px;font-weight:500;color:var(--ac);text-decoration:none}
.rt:hover{text-decoration:underline}
</style></head>

["d4l","4일차 점심","우메다 (오코노미야키·꼬치 등)",["한큐삼번가 식당가","햅파이브 식당가","오사카 스테이션 시티 식당가"]],

const SPOTS=[["오렌지 스트리트 (요쓰바시)","オレンジストリート 四ツ橋"],["이케베 악기점 (신사이바시스지)","イケベ楽器店 心斎橋"],["신사이바시스지 상점가","心斎橋筋商店街"],["도톤보리 크루즈 승선장","とんぼりリバークルーズ 太左衛門橋船着場"],["후시미이나리 대사","伏見稲荷大社"],["청수사","清水寺"],["난바 파크스 (스탠다드 프로덕트)","なんばパークス"],["돈키호테 도톤보리점","ドン・キホーテ 道頓堀店"],["햅파이브","HEP FIVE"],["우메다 스카이빌딩","梅田スカイビル"],["USJ","ユニバーサル・スタジオ・ジャパン"],["소라니와 온천 (벤텐초역 직결)","空庭温泉 OSAKA BAY TOWER"],["도톤보리","道頓堀"],["야키니쿠 리키마루 도톤보리점","焼肉力丸 なんば道頓堀店","大阪市中央区道頓堀1丁目9−1 ベルスードビル 5F"],["간사이공항","関西国際空港"]];
const INFO=[["hotel","숙소 이름·주소 (일본어)"],["term","항공 터미널 (T1/T2)"],["innn","INNN 픽업 시간·연락처"],["ticket","USJ 티켓·익스프레스 구매 메모"]];
const PACK0=["여권","항공권·e티켓","엔화·트래블카드","교통카드 5장","eSIM·로밍","보조배터리·충전기","방한복 (1월 최저 0~3도)","핫팩·장갑·목도리","상비약","우산·우비","캐리어 자물쇠","쇼핑용 보조가방","USJ 티켓 QR","INNN 예약 확인서","호텔 예약 확인서"];
const HOTEL="Esreed Hotel Namba Dotonbori East Osaka";
const home=()=>((ld("info",{}).hotel||"").trim()||HOTEL);
const dir=(o,d)=>"https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(o=="H"?home():o)+"&destination="+encodeURIComponent(d=="H"?home():d)+"&travelmode=transit";
const pl=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const rt=r=>`<a class="rt" target="_blank" rel="noopener" href="${dir(r[0],r[1])}">🚇 구글맵 경로</a>${r[2]?`<small>예상 노선: ${r[2]}</small>`:""}`;
const MH={"햅파이브 식당가":["","HEP FIVE Osaka"],"오사카 스테이션 시티 식당가":["","Osaka Station City restaurants"],"다루마 근처 다른 쿠시카츠 가게":["","串カツ 道頓堀"],"돈카츠 (신사이바시·난바)":["","とんかつ 心斎橋 なんば"],"요도바시 우메다 8층 레스토랑가":["식당마다 영업시간이 달라요","Yodobashi Camera Multimedia Umeda"],"한큐삼번가 식당가":["","Hankyu Sanbangai Umeda"],"다이마루 우메다 식당가":["","Daimaru Umeda"],"다루마":["신세카이 총본점 매일 11:00~22:30","Kushikatsu Daruma Shinsekai Sohonten"],"야에카츠":["","Yaekatsu Shinsekai Osaka"],"도톤보리 다루마 지점":["","Kushikatsu Daruma Dotonbori"],"야키니쿠 리키마루 도톤보리점 (120분 코스)":["1/12(화) 11:30~24:00 (월·금은 16시 개점). 예약 필수","焼肉力丸なんば道頓堀店"],"다이보쿠죠 도톤보리점 (와규 무한리필)":["","Yakiniku Daibokujo Dotonbori"],"리키마루 신사이바시점":["","焼肉力丸 心斎橋"],"카츠쿠라":["","Katsukura Kyoto Station"],"교토역 라멘 코지":["","Kyoto Ramen Koji"],"니시키 시장 꼬치·간식":["","Nishiki Market Kyoto"],"이치란 도톤보리":["24시간 영업, 무휴 (별관 기준)","Ichiran Dotonbori Honkan"],"킨류 라멘":["도톤보리점 24시간, 무휴","Kinryu Ramen Dotonbori"],"이마이 우동":["","Imai Udon Dotonbori Honten"],"미즈노":["","Mizuno Okonomiyaki Dotonbori"],"지보":["","Chibo Okonomiyaki Dotonbori"],"와나카 / 쿠쿠루 (타코야키)":["","Takoyaki Kukuru Dotonbori"]};
let tab=ld("tab","plan"),day=ld("day",0);
const R={
plan(){const D=DAYS[day];return `<div class="chips">${DAYS.map((x,i)=>`<button class="chip ${i==day?"on":""}" data-day="${i}">${x.d} (${x.w})<small>${x.t}</small></button>`).join("")}</div><ul class="tl">${D.it.map(i=>`<li class="${i[3]?"pb":""}"><time>${i[0]}</time><div class="t">${i[1]}</div>${i[2]?`<small>${i[2]}</small>`:""}${i[4]?rt(i[4]):""}</li>`).join("")}</ul><p class="mut">아침과 야식은 매일 편의점. 노란 점은 선택·대안 일정이에요.</p>`},
meal(){const m=ld("meal",{});return `<p class="mut">끼니마다 1·2·3순위 후보예요. 영업시간은 검색으로 확인한 곳만 적었고 바뀔 수 있어요. 나머지는 📍지도 링크에서 요일별 시간을 확인하세요. 먹은 곳은 체크하고 실제 금액(엔)을 적어요.</p>`+MEALS.map(x=>{const s=m[x[0]]||{};return `<div class="card"><div class="mh"><b>${x[1]}</b><span class="mut">${x[2]}</span></div><ol class="pk" style="padding-left:18px;list-style:decimal">${x[3].filter(Boolean).map(p=>{const h=MH[p]||[];return `<li>${p}${h[1]?` <a class="rt" target="_blank" rel="noopener" href="${pl(h[1])}">📍지도</a>`:""}${h[0]?`<small style="display:block">${h[0]}</small>`:""}</li>`}).join("")}</ol><div class="row"><label class="ck"><input type="checkbox" data-m="${x[0]}" ${s.ok?"checked":""}>먹었어요</label><input class="n" type="number" inputmode="numeric" placeholder="실제 엔" data-ma="${x[0]}" value="${s.a||""}"></div></div>`}).join("")},
bud(){const rate=ld("rate",8.4),act=ld("act",{}),m=ld("meal",{});const mealSum=Object.values(m).reduce((a,b)=>a+(+b.a||0),0);
let lo=0,hi=0,ac=0;const rows=BUD.map((b,i)=>{lo+=b[1];hi+=b[2];const a=i==2&&mealSum?mealSum:(+act[i]||0);ac+=a;return `<tr><td>${b[0]}</td><td>${(b[1]/10000).toFixed(1)}~${(b[2]/10000).toFixed(1)}만</td><td>${i==2&&mealSum?`${won(a)} <span class="mut">(식사 탭)</span>`:`<input class="n" type="number" inputmode="numeric" data-a="${i}" value="${act[i]||""}" placeholder="0">`}</td></tr>`}).join("");
const pct=Math.min(100,ac/hi*100);
return `<div class="card"><div class="mut">환율 (1엔 = 원)</div><div class="row"><input class="n" type="number" step="0.01" id="rate" value="${rate}"><span class="mut">10월 중순 기준 약 8.4원</span></div></div>
<div class="card"><div class="mut">계획 (항공·숙소·INNN 제외)</div><div class="big">${won(lo*rate)} ~ ${won(hi*rate)}원</div><div class="mut">${won(lo)} ~ ${won(hi)}엔</div></div>
<div class="card"><div class="mut">지출 (엔 기준 입력)</div><div class="big">${won(ac)}엔 · ${won(ac*rate)}원</div><div class="bar"><i style="width:${pct}%"></i></div><div class="mut">상한 대비 ${pct.toFixed(0)}%, 남은 ${won((hi-ac)*rate)}원</div></div>
<div class="card"><table><tr><th>항목</th><th>계획(엔)</th><th>실제(엔)</th></tr>${rows}</table><p class="mut">익스프레스 패스, INNN 요금, 악기 구매는 계획에 없어요. 필요하면 쇼핑·기념품 칸에 합산하세요.</p></div>`},
spot(){const f=ld("info",{});return `<p class="mut">길을 잃으면 이 화면을 택시기사나 역무원에게 보여주세요.</p>`+INFO.map(x=>`<div class="card"><div class="mut">${x[1]}</div><input type="text" data-i="${x[0]}" value="${esc(f[x[0]]||"")}" placeholder="입력"></div>`).join("")+SPOTS.map(s=>`<div class="card"><div class="mut">${s[0]}</div><div class="jp">${s[1]}</div>${s[2]?`<div>${s[2]}</div>`:""}<a class="rt" target="_blank" rel="noopener" href="${pl(s[1])}">📍 구글맵으로 열기</a></div>`).join("")},
pack(){const pp=pk(),p=Object.keys(pp).sort().map(k=>Object.assign({k},pp[k]));const dn=p.filter(x=>x.d).length;return `<p class="mut">${dn} / ${p.length} 완료</p><div class="card">${p.map((x,i)=>`<label class="ck" style="padding:6px 0"><input type="checkbox" data-p="${x.k}" ${x.d?"checked":""}><span class="${x.d?"done":""}">${esc(x.n)}</span></label>`).join("")}<div class="row"><input type="text" id="np" placeholder="준비물 추가"><button class="btn" id="add">추가</button></div></div>`}};
function draw(){$v.innerHTML=R[tab]();nav.innerHTML=TABS.map(t=>`<button class="${t[0]==tab?"on":""}" data-tab="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join("")}
const $v=document.getElementById("v"),nav=document.getElementById("nav");
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab],[data-day],#add");if(!b)return;
if(b.dataset.tab){tab=b.dataset.tab;sv("tab",tab);draw();scrollTo(0,0)}
else if(b.dataset.day){day=+b.dataset.day;sv("day",day);draw()}
else if(b.id=="add"){const v=document.getElementById("np").value.trim();if(!v)return;const p=pk();p["b"+Date.now()]={n:v,d:0};sv("pack",p);draw()}});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
if(d.m){const m=ld("meal",{});m[d.m]=Object.assign(m[d.m]||{},{ok:t.checked});sv("meal",m)}
else if(d.p){const p=pk();p[d.p].d=t.checked?1:0;sv("pack",p);draw()}});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
if(d.ma){const m=ld("meal",{});m[d.ma]=Object.assign(m[d.ma]||{},{a:t.value});sv("meal",m)}
else if(d.a){const a=ld("act",{});a[d.a]=t.value;sv("act",a)}
else if(d.i){const f=ld("info",{});f[d.i]=t.value;sv("info",f)}
else if(t.id=="rate"){sv("rate",+t.value||8.4)}});
document.addEventListener("focusout",e=>{if(tab=="bud"&&(e.target.dataset.a||e.target.id=="rate"))draw()});
draw();
initShared();
</script></body></html>
